x-app-image: &app-image ghcr.io/sdrpsps/ohttps-deploy:${IMAGE_TAG:-latest}

services:
  web:
    image: *app-image
    build: .
    command: node server.js
    env_file: .env
    environment:
      SKIP_DB_MIGRATION: "1"
    volumes:
      - ${OHTTPS_DATA_DIR:-./data}:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - worker
  worker:
    image: *app-image
    command: node --import tsx app/worker.ts
    env_file: .env
    volumes:
      - ${OHTTPS_DATA_DIR:-./data}:/app/data
