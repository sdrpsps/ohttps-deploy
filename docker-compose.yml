x-app-image: &app-image ghcr.io/sdrpsps/ohttps-deploy:${IMAGE_TAG:-latest}

services:
  web:
    image: *app-image
    build: .
    command: node server.js
    restart: unless-stopped
    env_file: .env
    environment:
      SKIP_DB_MIGRATION: "1"
    volumes:
      - ${OHTTPS_DATA_DIR:-./data}:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - worker
  worker:
    image: *app-image
    command: node --import tsx app/worker.ts
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${OHTTPS_DATA_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get({socketPath:'/app/data/worker-control.sock',path:'/health'},(res)=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1);});"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    enable_ipv6: true
